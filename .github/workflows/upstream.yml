name: Upstream suites

# Runs Doctrine's own DBAL and ORM test suites against the driver (R21), with
# ORM 3.7.6, on DBAL 4.5.0 and on the DBAL 4.6.x branch. Every job gates, so a
# test that the 4.6.x branch adds and DuckDB cannot pass fails the build until
# it is fixed or listed. Each run fails on a test failure outside
# tests/Upstream/skiplist.php and on a skip-list entry that names no test, and
# warns about entries whose tests pass again.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: upstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream:
    name: ${{ matrix.suite }} suite / DBAL ${{ matrix.dbal }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [dbal, orm]
        dbal: ['4.5.0', '4.6.x']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: Build ext-duckdb from the 2.0.0 tag
        uses: ./.github/actions/ext-duckdb

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-upstream-${{ matrix.suite }}-${{ matrix.dbal }}-${{ hashFiles('composer.json', 'tests/Upstream/run.php') }}
          restore-keys: composer-upstream-${{ matrix.suite }}-${{ matrix.dbal }}-

      - name: Run the ${{ matrix.suite }} suite
        run: php tests/Upstream/run.php ${{ matrix.suite }} --dbal=${{ matrix.dbal }}

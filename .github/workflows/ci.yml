name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / DBAL ${{ matrix.dbal }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dbal: ['4.5']
        experimental: [false]
        include:
          - php: '8.5'
            dbal: '4.6.x-dev'
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Build ext-duckdb from the 2.0.0 tag
        uses: ./.github/actions/ext-duckdb

      - name: Pin DBAL ${{ matrix.dbal }}
        if: matrix.dbal != '4.5'
        run: composer require --dev --no-update "doctrine/dbal:${{ matrix.dbal }} as 4.5.99"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Coding standard
        if: matrix.dbal == '4.5'
        run: composer cs

      - name: Static analysis
        if: matrix.dbal == '4.5'
        run: composer phpstan

      - name: Tests
        run: composer test

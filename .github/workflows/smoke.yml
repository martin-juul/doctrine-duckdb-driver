name: Symfony smoke

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Symfony smoke / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Build ext-duckdb from the 2.0.0 tag
        uses: ./.github/actions/ext-duckdb

      - name: Install the smoke application
        working-directory: tests/Smoke/symfony-app
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run the smoke application
        run: composer test:smoke
